databases:
  - name: api-productos-adilene-db
    databaseName: productosdb
    user: app
    plan: free

services:
  - type: web
    name: api-productos-adilene
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: api-productos-adilene-db
          property: connectionString
      - key: API_KEY
        generateValue: true
