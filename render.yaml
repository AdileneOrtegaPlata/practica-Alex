databases:
  - name: items-db
    databaseName: itemsdb
    user: app
    plan: free

services:
  - type: web
    name: items-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: items-db
          property: connectionString
      - key: API_KEY
        generateValue: true
